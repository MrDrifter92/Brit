<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>body{margin:0;background:var(--surface-page);padding:18px 20px;font:var(--type-body)}.sw{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:10px}.c{display:grid;gap:0}.chip{height:60px;border-radius:var(--radius-sm);border:1px solid color-mix(in srgb,var(--bark-800) 12%,transparent)}.n{font:var(--weight-regular) 11px/1.4 var(--font-body);letterSpacing:.04em;color:var(--ink-600);margin-top:7px;overflow-wrap:anywhere}.v{font:var(--weight-regular) 10px/1.4 var(--font-sans);color:var(--ink-400);letter-spacing:.04em;overflow-wrap:anywhere}</style>
</head><body><div class="sw" style="--n:5"><div class="c"><div class="chip" style="background:var(--bark-800)"></div><div class="n">bark-800</div><div class="v">--bark-800</div></div><div class="c"><div class="chip" style="background:var(--bark-700)"></div><div class="n">bark-700</div><div class="v">--bark-700</div></div><div class="c"><div class="chip" style="background:var(--bark-600)"></div><div class="n">bark-600</div><div class="v">--bark-600</div></div><div class="c"><div class="chip" style="background:var(--bark-500)"></div><div class="n">bark-500</div><div class="v">--bark-500</div></div><div class="c"><div class="chip" style="background:var(--bark-400)"></div><div class="n">bark-400</div><div class="v">--bark-400</div></div></div></body></html>
