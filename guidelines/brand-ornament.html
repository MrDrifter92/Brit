<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../styles.css">

<style>body{margin:0;background:var(--surface-page);padding:18px 20px;font:var(--type-body)}.wrap{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}.fl{display:flex;align-items:center;gap:14px;color:var(--bark-600)}.fl span:first-child,.fl span:last-child{flex:1;height:1px;background:var(--rule-hairline)}.g{font:var(--weight-regular) 14px/1 var(--font-body)}.frame{position:relative;height:130px;background:var(--paper-100);display:grid;place-items:center}.frame::before,.frame::after{content:"";position:absolute;border:1px solid var(--rule-hairline);border-radius:var(--radius-sm)}.frame::before{inset:10px}.frame::after{inset:14px;opacity:.55}.wm{font:var(--weight-regular) 13px/1.2 var(--font-display);letter-spacing:var(--tracking-wordmark);text-indent:var(--tracking-wordmark);text-transform:uppercase;color:var(--bark-700)}.stk{display:grid;gap:20px}</style>
</head><body><div class="wrap"><div class="stk"><div class="fl"><span></span><i class="g">&#10086;</i><span></span></div><div class="fl"><span></span><i class="g">&#10087;</i><span></span></div><div class="fl"><span></span><i class="g">&#10022;</i><span></span></div></div><div class="frame"><div class="wm">Britanical Blends</div></div></div></body></html>
