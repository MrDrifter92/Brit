<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>body{margin:0;background:var(--surface-page);padding:18px 20px;font:var(--type-body)}.sw{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:10px}.c{display:grid;gap:0}.chip{height:60px;border-radius:var(--radius-sm);border:1px solid color-mix(in srgb,var(--bark-800) 12%,transparent)}.n{font:var(--weight-regular) 11px/1.4 var(--font-body);letterSpacing:.04em;color:var(--ink-600);margin-top:7px;overflow-wrap:anywhere}.v{font:var(--weight-regular) 10px/1.4 var(--font-sans);color:var(--ink-400);letter-spacing:.04em;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 26px}.r{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center}.s{width:34px;height:22px;border-radius:var(--radius-xs);border:1px solid color-mix(in srgb,var(--bark-800) 14%,transparent)}.k{font:var(--weight-regular) 12px/1 var(--font-body);color:var(--ink-700);overflow-wrap:anywhere}.t{font:var(--weight-regular) 10px/1 var(--font-sans);color:var(--ink-400)}@media (max-width:420px){.grid{grid-template-columns:1fr}}</style>
</head><body><div class="grid"><div class="r"><div class="s" style="background:var(--surface-page)"></div><div class="k">--surface-page</div><div class="t">paper-50</div></div><div class="r"><div class="s" style="background:var(--surface-card)"></div><div class="k">--surface-card</div><div class="t">paper-100</div></div><div class="r"><div class="s" style="background:var(--surface-aged)"></div><div class="k">--surface-aged</div><div class="t">paper-300</div></div><div class="r"><div class="s" style="background:var(--surface-inverse)"></div><div class="k">--surface-inverse</div><div class="t">bark-700</div></div><div class="r"><div class="s" style="background:var(--text-heading)"></div><div class="k">--text-heading</div><div class="t">ink-900</div></div><div class="r"><div class="s" style="background:var(--text-body)"></div><div class="k">--text-body</div><div class="t">ink-800</div></div><div class="r"><div class="s" style="background:var(--text-muted)"></div><div class="k">--text-muted</div><div class="t">ink-500</div></div><div class="r"><div class="s" style="background:var(--text-link)"></div><div class="k">--text-link</div><div class="t">wine-700</div></div><div class="r"><div class="s" style="background:var(--brand-primary)"></div><div class="k">--brand-primary</div><div class="t">bark-700</div></div><div class="r"><div class="s" style="background:var(--accent-bedtime)"></div><div class="k">--accent-bedtime</div><div class="t">wheat-400</div></div><div class="r"><div class="s" style="background:var(--accent-sunset)"></div><div class="k">--accent-sunset</div><div class="t">wine-band</div></div><div class="r"><div class="s" style="background:var(--accent-wildwood)"></div><div class="k">--accent-wildwood</div><div class="t">moss-500</div></div></div></body></html>
