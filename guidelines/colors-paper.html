<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>body{margin:0;background:var(--surface-page);padding:18px 20px;font:var(--type-body)}.sw{display:grid;grid-template-columns:repeat(var(--n,6),1fr);gap:10px}.c{display:grid;gap:0}.chip{height:60px;border-radius:var(--radius-sm);border:1px solid color-mix(in srgb,var(--bark-800) 12%,transparent)}.n{font:var(--weight-regular) 11px/1.4 var(--font-body);letterSpacing:.04em;color:var(--ink-600);margin-top:7px}.v{font:var(--weight-regular) 10px/1.4 var(--font-sans);color:var(--ink-400);letter-spacing:.04em}</style>
</head><body><div class="sw" style="--n:7"><div class="c"><div class="chip" style="background:var(--paper-50)"></div><div class="n">paper-50</div><div class="v">--paper-50</div></div><div class="c"><div class="chip" style="background:var(--paper-100)"></div><div class="n">paper-100</div><div class="v">--paper-100</div></div><div class="c"><div class="chip" style="background:var(--paper-200)"></div><div class="n">paper-200</div><div class="v">--paper-200</div></div><div class="c"><div class="chip" style="background:var(--paper-300)"></div><div class="n">paper-300</div><div class="v">--paper-300</div></div><div class="c"><div class="chip" style="background:var(--paper-400)"></div><div class="n">paper-400</div><div class="v">--paper-400</div></div><div class="c"><div class="chip" style="background:var(--paper-500)"></div><div class="n">paper-500</div><div class="v">--paper-500</div></div><div class="c"><div class="chip" style="background:var(--blush-100)"></div><div class="n">blush-100</div><div class="v">--blush-100</div></div></div></body></html>
