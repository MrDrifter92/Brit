<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Put yourself back together</title>
<meta name="theme-color" content="#141A33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141A33;
  --ink-deep:#0B0F21;
  --paper:#F3EDE1;
  --amber:#FFAE2E;
  --dim:#8A93B8;
  --board: min(86vw, 400px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:"DM Mono",ui-monospace,monospace;
  overflow:hidden;
  overscroll-behavior:none;
}
.screen{
  position:fixed;inset:0;z-index:1;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:26px 20px calc(26px + env(safe-area-inset-bottom));
  text-align:center;
  overflow:hidden;
}
.screen.on{display:flex}
.screen > :not(.bg):not(.scrim){position:relative;z-index:2}

/* ---- drifting photo backdrop ---- */
.bg{
  position:absolute;inset:0;z-index:0;
  background-size:cover;background-position:center;
  opacity:.34;
  animation:drift 30s ease-in-out infinite alternate;
  will-change:transform;
}
.bg.faint{opacity:.16}
.scrim{
  position:absolute;inset:0;z-index:1;
  background:
    radial-gradient(115% 65% at 50% -8%, rgba(255,174,46,.14), transparent 60%),
    linear-gradient(180deg, rgba(20,26,51,.62) 0%, rgba(20,26,51,.34) 38%, rgba(11,15,33,.92) 100%);
}
@keyframes drift{
  from{transform:scale(1.09) translate3d(-1.6%,-1.2%,0)}
  to{transform:scale(1.17) translate3d(1.6%,1.4%,0)}
}

.eyebrow{
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);
  display:flex;align-items:center;gap:10px;margin-bottom:18px;
}
.eyebrow::before,.eyebrow::after{content:"";height:1px;width:26px;background:rgba(255,174,46,.5)}
h1{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
  font-size:clamp(34px,10.5vw,54px);line-height:.95;letter-spacing:-.03em;
  max-width:9ch;text-shadow:0 4px 26px rgba(11,15,33,.6);
}
.sub{margin-top:16px;font-size:13.5px;line-height:1.65;color:var(--paper);opacity:.82;max-width:29ch}
.sub .amb{color:var(--amber);opacity:1}
.stack{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:32px;width:100%}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{text-decoration:none}
.btn{
  display:block;background:var(--amber);color:var(--ink-deep);
  font-weight:500;font-size:15px;letter-spacing:.02em;text-align:center;
  padding:16px 30px;border-radius:100px;width:min(100%,300px);
  transition:transform .15s ease, filter .15s ease;
}
.btn:active{transform:scale(.97);filter:brightness(1.08)}
.btn.ghost{background:rgba(243,237,225,.06);color:var(--paper);border:1px solid rgba(243,237,225,.26)}
.link{font-size:13px;color:var(--dim);text-decoration:underline;text-underline-offset:4px;padding:8px}
button:focus-visible,a:focus-visible,label:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* ---- puzzle ---- */
#board{
  width:var(--board);height:var(--board);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  gap:0;transition:gap .38s cubic-bezier(.2,.9,.3,1);
}
#board.playing{gap:5px}
.tile{
  background-repeat:no-repeat;background-size:300% 300%;
  border-radius:0;transform:translate(0,0) rotate(0deg) scale(1);
  transition:transform .38s cubic-bezier(.2,.9,.3,1), border-radius .38s ease, box-shadow .2s ease;
}
#board.playing .tile{border-radius:7px;box-shadow:0 3px 10px rgba(11,15,33,.55)}
#board.scatter .tile{transform:translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(.9)}
.tile.sel{box-shadow:0 0 0 3px var(--amber), 0 8px 20px rgba(11,15,33,.6);transform:scale(.92);z-index:2}
.tile.pop{animation:pop .22s ease}
@keyframes pop{50%{transform:scale(.9)}}
.wrap{position:relative;display:flex;align-items:center;justify-content:center}
#flash{position:absolute;inset:-6px;border-radius:10px;background:var(--paper);opacity:0;pointer-events:none}
#flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.hud{
  width:var(--board);display:flex;justify-content:space-between;align-items:center;
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:14px;
}
.hud b{color:var(--paper);font-weight:500}
#lock.open{color:var(--amber)}
.hint{margin-top:18px;font-size:12px;color:var(--dim);letter-spacing:.04em}

/* ---- camera ---- */
#cam{width:var(--board);height:var(--board);object-fit:cover;transform:scaleX(-1);border-radius:4px;background:var(--ink-deep)}
.camwrap{position:relative}
.corner{position:absolute;width:22px;height:22px;border:2px solid var(--amber);opacity:.9}
.corner.tl{top:-7px;left:-7px;border-right:0;border-bottom:0}
.corner.tr{top:-7px;right:-7px;border-left:0;border-bottom:0}
.corner.bl{bottom:-7px;left:-7px;border-right:0;border-top:0}
.corner.br{bottom:-7px;right:-7px;border-left:0;border-top:0}
#shutter{width:74px;height:74px;border-radius:50%;background:var(--paper);margin-top:26px;box-shadow:0 0 0 4px rgba(243,237,225,.18);transition:transform .12s ease}
#shutter:active{transform:scale(.9)}

/* ---- prize ---- */
#doneImg{width:min(46vw,190px);border-radius:8px;box-shadow:0 14px 40px rgba(11,15,33,.75)}
.quote{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:700;
  font-size:clamp(22px,6.4vw,30px);line-height:1.2;letter-spacing:-.02em;
  max-width:17ch;margin:0 auto;text-shadow:0 4px 26px rgba(11,15,33,.7);
}
.reveal{opacity:0;transform:translateY(12px);animation:rise .8s ease forwards}
.d1{animation-delay:.35s}.d2{animation-delay:.7s}.d3{animation-delay:1.05s}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
@media (max-height:680px){h1{font-size:clamp(30px,9vw,42px)} .stack{margin-top:22px} :root{--board:min(78vw,340px)}}
</style>
</head>
<body>

<!-- 1. START -->
<section class="screen on" id="s-start">
  <div class="bg" id="bgA"></div><div class="scrim"></div>
  <div class="eyebrow">Photo booth</div>
  <h1>Put yourself back together</h1>
  <p class="sub">Take a selfie. It falls apart. Put it back and <span class="amb">you win something worth keeping.</span></p>
  <div class="stack">
    <button class="btn" id="go">Open camera</button>
    <label class="link" for="pick" tabindex="0">Use a photo instead</label>
    <input type="file" id="pick" accept="image/*" hidden>
  </div>
</section>

<!-- 2. CAMERA -->
<section class="screen" id="s-cam">
  <div class="bg faint" id="bgB"></div><div class="scrim"></div>
  <div class="eyebrow">Look up</div>
  <div class="camwrap">
    <video id="cam" playsinline autoplay muted></video>
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
  </div>
  <button id="shutter" aria-label="Take the photo"></button>
</section>

<!-- 3. PUZZLE -->
<section class="screen" id="s-play">
  <div class="hud">
    <span>Moves <b id="moves">0</b></span>
    <span id="lock">Prize locked</span>
  </div>
  <div class="wrap"><div id="board"></div><div id="flash"></div></div>
  <p class="hint" id="hint">Tap two pieces to swap them</p>
  <button class="link" id="restart">Start over</button>
</section>

<!-- 4. PRIZE -->
<section class="screen" id="s-done">
  <div class="bg" id="bgC"></div><div class="scrim"></div>
  <img id="doneImg" class="reveal" alt="Your finished photo">
  <div class="eyebrow reveal d1" style="margin-top:22px">Your prize</div>
  <p class="quote reveal d2" id="prize"></p>
  <div class="stack reveal d3" style="margin-top:26px">
    <a class="btn" id="save" download="back-together.jpg">Save the photo</a>
    <a class="btn ghost" id="tiktok" href="#">Back to TikTok</a>
    <button class="link" id="again">Go again</button>
  </div>
</section>

<canvas id="cv" hidden></canvas>

document.getElementById("bgA").style.backgroundImage = `url(${BG_PORTRAIT})`;
document.getElementById("bgB").style.backgroundImage = `url(${BG_PORTRAIT})`;
document.getElementById("bgC").style.backgroundImage = `url(${BG_SKY})`;

const N = 3;
const $ = id => document.getElementById(id);
const screens = ["s-start","s-cam","s-play","s-done"];
const show = id => screens.forEach(s => $(s).classList.toggle("on", s === id));
$("tiktok").href = TIKTOK_URL;

let stream = null, photo = "", state = [], sel = null, moves = 0, locked = true, lastPrize = -1;

/* ---------- getting a picture ---------- */
$("go").addEventListener("click", async () => {
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 1080 }, height: { ideal: 1080 } },
        audio: false
      });
      $("cam").srcObject = stream;
      show("s-cam");
      return;
    } catch (e) { /* fall through, no dead end */ }
  }
  $("pick").click();          // phone's own camera sheet
});

$("shutter").addEventListener("click", () => {
  const v = $("cam");
  const side = Math.min(v.videoWidth, v.videoHeight);
  const cv = $("cv"), ctx = cv.getContext("2d");
  cv.width = cv.height = side;
  ctx.translate(side, 0); ctx.scale(-1, 1);
  ctx.drawImage(v, (v.videoWidth - side) / 2, (v.videoHeight - side) / 2, side, side, 0, 0, side, side);
  photo = cv.toDataURL("image/jpeg", 0.9);
  stopCam();
  begin();
});

$("pick").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const side = Math.min(img.width, img.height);
      const cv = $("cv"), ctx = cv.getContext("2d");
      cv.width = cv.height = side;
      ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, side, side);
      photo = cv.toDataURL("image/jpeg", 0.9);
      begin();
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
  e.target.value = "";
});

document.querySelector('label[for="pick"]').addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("pick").click(); }
});

function stopCam(){ if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }

/* ---------- puzzle ---------- */
function begin(){
  moves = 0; sel = null; locked = true;
  $("moves").textContent = "0";
  $("lock").textContent = "Prize locked";
  $("lock").classList.remove("open");
  $("hint").textContent = "Hold still…";
  const board = $("board");
  board.className = ""; board.innerHTML = "";
  state = [...Array(N * N).keys()];

  for (let i = 0; i < N * N; i++) {
    const t = document.createElement("button");
    t.className = "tile";
    t.setAttribute("aria-label", "Piece " + (i + 1));
    t.style.backgroundImage = `url(${photo})`;
    t.style.setProperty("--tx", (Math.random() * 40 - 20).toFixed(1) + "px");
    t.style.setProperty("--ty", (Math.random() * 40 - 20).toFixed(1) + "px");
    t.style.setProperty("--rot", (Math.random() * 16 - 8).toFixed(1) + "deg");
    t.addEventListener("click", () => tap(i));
    board.appendChild(t);
  }
  paint();
  show("s-play");

  setTimeout(() => board.classList.add("scatter"), 780);
  setTimeout(() => {
    state = shuffled(); paint();
    board.classList.remove("scatter");
    board.classList.add("playing");
    $("hint").textContent = "Tap two pieces to swap them";
    locked = false;
  }, 1160);
}

function shuffled(){
  let a;
  for (let n = 0; n < 60; n++) {
    a = [...Array(N * N).keys()];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    if (a.every((v, i) => v !== i)) return a;
  }
  return a;
}

function paint(){
  const step = 100 / (N - 1);
  [...$("board").children].forEach((t, pos) => {
    const p = state[pos];
    t.style.backgroundPosition = `${(p % N) * step}% ${Math.floor(p / N) * step}%`;
  });
}

function tap(pos){
  if (locked) return;
  const tiles = $("board").children;
  if (sel === null) { sel = pos; tiles[pos].classList.add("sel"); return; }
  tiles[sel].classList.remove("sel");
  if (sel === pos) { sel = null; return; }

  [state[sel], state[pos]] = [state[pos], state[sel]];
  paint();
  [sel, pos].forEach(i => {
    tiles[i].classList.remove("pop"); void tiles[i].offsetWidth; tiles[i].classList.add("pop");
  });
  sel = null;
  $("moves").textContent = ++moves;
  if (state.every((v, i) => v === i)) win();
}

function win(){
  locked = true;
  $("hint").textContent = "That's you.";
  $("lock").textContent = "Prize unlocked";
  $("lock").classList.add("open");
  $("board").classList.remove("playing");
  $("flash").classList.add("go");
  setTimeout(() => {
    let i;
    do { i = Math.floor(Math.random() * PRIZES.length); } while (PRIZES.length > 1 && i === lastPrize);
    lastPrize = i;
    $("prize").textContent = PRIZES[i];
    $("doneImg").src = photo;
    $("save").href = photo;
    show("s-done");
  }, 900);
}

/* ---------- controls ---------- */
$("restart").addEventListener("click", () => { stopCam(); show("s-start"); });
$("again").addEventListener("click", () => begin());
document.addEventListener("visibilitychange", () => { if (document.hidden) stopCam(); });
</script>
