<!-- @dsCard group="Brand" viewport="700x150" name="Motion & states" subtitle="Fades and 1px nudges; no bounce, no spring" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>body{margin:0;background:var(--surface-page);padding:18px 20px;font:var(--type-body)}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;padding:12px 26px;border-radius:var(--radius-sm);font:var(--weight-regular) 12px/1 var(--font-body);letter-spacing:var(--tracking-caps);text-transform:uppercase;border:1px solid transparent}.p{background:var(--bark-700);color:var(--paper-100)}.ph{background:var(--bark-800);color:var(--paper-100)}.pp{background:var(--bark-800);color:var(--paper-100);transform:translateY(1px)}.pd{background:var(--bark-700);color:var(--paper-100);opacity:.42}.cap{font:var(--weight-regular) 10px/1.5 var(--font-sans);color:var(--ink-400);text-align:center;margin-top:8px;letter-spacing:.04em}.meta{font:var(--weight-regular) 10px/1.7 var(--font-sans);color:var(--ink-400);letter-spacing:.04em;margin-top:14px}</style>
</head><body><div class="row"><div><span class="btn p">Rest</span><div class="cap">rest</div></div><div><span class="btn ph">Hover</span><div class="cap">hover &mdash; darken one step</div></div><div><span class="btn pp">Press</span><div class="cap">press &mdash; translateY(1px)</div></div><div><span class="btn pd">Disabled</span><div class="cap">disabled &mdash; 42% opacity</div></div></div><div class="meta">--dur-fast 140ms for colour &middot; --dur-base 240ms for surfaces &middot; --ease-standard cubic-bezier(.22,.61,.36,1) &middot; never scale, never bounce</div></body></html>
