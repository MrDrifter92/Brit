<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>body{margin:0;background:var(--surface-page);padding:18px 20px;font:var(--type-body)}.row{display:flex;gap:16px;align-items:flex-end}.b{width:74px;height:56px;background:var(--paper-200);border:1px solid var(--border-panel)}.t{font:var(--weight-regular) 10px/1.5 var(--font-sans);color:var(--ink-400);display:block;text-align:center;margin-top:7px;letter-spacing:.04em}</style>
</head><body><div class="row"><div><div class="b" style="border-radius:0"></div><span class="t">none</span></div><div><div class="b" style="border-radius:var(--radius-sm)"></div><span class="t">sm 3</span></div><div><div class="b" style="border-radius:var(--radius-md)"></div><span class="t">md 6</span></div><div><div class="b" style="border-radius:var(--radius-lg)"></div><span class="t">lg 10</span></div><div><div class="b" style="border-radius:var(--radius-panel)"></div><span class="t">panel 14</span></div><div><div class="b" style="border-radius:var(--radius-jar)"></div><span class="t">jar 18</span></div><div><div class="b" style="border-radius:var(--radius-pill)"></div><span class="t">pill</span></div><div><div class="b" style="border-radius:var(--radius-round)"></div><span class="t">round</span></div></div></body></html>
