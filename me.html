<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Put yourself back together</title>
<meta name="theme-color" content="#141A33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141A33;
  --ink-deep:#0B0F21;
  --paper:#F3EDE1;
  --amber:#FFAE2E;
  --dim:#8A93B8;
  --board: min(86vw, 400px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:"DM Mono",ui-monospace,monospace;
  overflow:hidden;
  overscroll-behavior:none;
}
.screen{
  position:fixed;inset:0;z-index:1;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:26px 20px calc(26px + env(safe-area-inset-bottom));
  text-align:center;
  overflow:hidden;
}
.screen.on{display:flex}
.screen > :not(.bg):not(.scrim){position:relative;z-index:2}

/* ---- drifting video backdrop ---- */
.bg{
  position:absolute;inset:0;z-index:0;
  width: 100%; height: 100%; object-fit: cover; /* Added to make the video fill the screen */
  opacity:.34;
  animation:drift 30s ease-in-out infinite alternate;
  will-change:transform;
}
.bg.faint{opacity:.16}
.scrim{
  position:absolute;inset:0;z-index:1;
  background:
    radial-gradient(115% 65% at 50% -8%, rgba(255,174,46,.14), transparent 60%),
    linear-gradient(180deg, rgba(20,26,51,.62) 0%, rgba(20,26,51,.34) 38%, rgba(11,15,33,.92) 100%);
}
@keyframes drift{
  from{transform:scale(1.09) translate3d(-1.6%,-1.2%,0)}
  to{transform:scale(1.17) translate3d(1.6%,1.4%,0)}
}

.eyebrow{
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);
  display:flex;align-items:center;gap:10px;margin-bottom:18px;
}
.eyebrow::before,.eyebrow::after{content:"";height:1px;width:26px;background:rgba(255,174,46,.5)}
h1{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
  font-size:clamp(34px,10.5vw,54px);line-height:.95;letter-spacing:-.03em;
  max-width:9ch;text-shadow:0 4px 26px rgba(11,15,33,.6);
}
.sub{margin-top:16px;font-size:13.5px;line-height:1.65;color:var(--paper);opacity:.82;max-width:29ch}
.sub .amb{color:var(--amber);opacity:1}
.stack{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:32px;width:100%}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{text-decoration:none}
.btn{
  display:block;background:var(--amber);color:var(--ink-deep);
  font-weight:500;font-size:15px;letter-spacing:.02em;text-align:center;
  padding:16px 30px;border-radius:100px;width:min(100%,300px);
  transition:transform .15s ease, filter .15s ease;
}
.btn:active{transform:scale(.97);filter:brightness(1.08)}
.btn.ghost{background:rgba(243,237,225,.06);color:var(--paper);border:1px solid rgba(243,237,225,.26)}
.link{font-size:13px;color:var(--dim);text-decoration:underline;text-underline-offset:4px;padding:8px}
button:focus-visible,a:focus-visible,label:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* ---- puzzle ---- */
#board{
  width:var(--board);height:var(--board);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  gap:0;transition:gap .38s cubic-bezier(.2,.9,.3,1);
}
#board.playing{gap:5px}
.tile{
  background-repeat:no-repeat;background-size:300% 300%;
  border-radius:0;transform:translate(0,0) rotate(0deg) scale(1);
  transition:transform .38s cubic-bezier(.2,.9,.3,1), border-radius .38s ease, box-shadow .2s ease;
}
#board.playing .tile{border-radius:7px;box-shadow:0 3px 10px rgba(11,15,33,.55)}
#board.scatter .
