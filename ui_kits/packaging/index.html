<!-- @dsCard group="Packaging" viewport="1280x820" name="Product card range" subtitle="The three-panel info card, recreated from the printed artwork" -->
<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Britanical Blends — Packaging</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
body{margin:0;background:var(--surface-page);min-height:100vh}
.page{max-width:1280px;margin:0 auto;padding:44px 40px 72px}
.head{display:grid;justify-items:center;gap:14px;margin-bottom:14px}
.tabs{display:flex;gap:8px;justify-content:center;margin:30px 0 34px;flex-wrap:wrap}
.detail{display:grid;grid-template-columns:auto auto;gap:56px;justify-content:center;align-items:start;margin-top:8px}
.aside{display:grid;gap:22px;max-width:330px;align-content:start;padding-top:8px}
.aside h4{margin:0;font:600 12px/1.4 var(--font-body);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-900)}
.aside p{margin:0;font:var(--type-body-sm);color:var(--ink-700)}
.note{font:var(--weight-regular) 11px/1.6 var(--font-sans);letter-spacing:.04em;color:var(--ink-400);text-align:center;margin-top:56px}
@media (max-width:760px){
.page{padding:36px 20px 56px}
.detail{grid-template-columns:1fr;justify-items:center;gap:28px}
.aside{max-width:420px;width:100%;justify-items:center;text-align:center}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="blends.js"></script>
<script type="text/babel" src="ProductCard.jsx"></script>
<script type="text/babel" src="JarLabel.jsx"></script>
<script type="text/babel" src="CardShelf.jsx"></script>
<script type="text/babel" data-presets="react">
const BBi = window.BritanicalBlendsDesignSystem_707ab1 || {};

function useCardWidth(base, min = 220) {
  const calc = () => Math.round(Math.max(min, Math.min(base, (typeof window !== 'undefined' ? window.innerWidth : base) - 48)));
  const [w, setW] = React.useState(calc);
  React.useEffect(() => {
    const onResize = () => setW(calc());
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, [base, min]);
  return w;
}

function App() {
  const [view, setView] = React.useState('range');
  const [sel, setSel] = React.useState('sunset');
  const blend = BB_BLENDS.find((b) => b.key === sel);
  const rangeWidth = useCardWidth(330);
  const detailWidth = useCardWidth(420);
  const jarWidth = useCardWidth(280, 180);
  return (
    <div className="page">
      <header className="head">
        <BBi.Wordmark size="xl" color="var(--bark-700)" />
        <BBi.Strapline size={12} color="var(--ink-500)" />
        <BBi.Fleuron width={260} glyphColor="var(--bark-600)" style={{ marginTop: 4 }} />
      </header>

      <nav className="tabs">
        <BBi.Button size="sm" variant={view === 'range' ? 'primary' : 'secondary'} onClick={() => setView('range')}>The range</BBi.Button>
        {BB_BLENDS.map((b) => (
          <BBi.Button key={b.key} size="sm" variant={view === 'detail' && sel === b.key ? 'primary' : 'secondary'}
            onClick={() => { setSel(b.key); setView('detail'); }}>{b.name.join(' ')}</BBi.Button>
        ))}
      </nav>

      {view === 'range' ? (
        <CardShelf blends={BB_BLENDS} selected={sel} cardWidth={rangeWidth}
          onSelect={(k) => { setSel(k); setView('detail'); }} />
      ) : (
        <div className="detail" data-accent={blend.accent}>
          <ProductCard blend={blend} width={detailWidth} />
          <div className="aside">
            <JarLabel blend={blend} width={jarWidth} />
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              <BBi.Badge tone="soft">Loose leaf</BBi.Badge>
              <BBi.Badge tone="outline">50g</BBi.Badge>
              {blend.key === 'sunset' && <BBi.Badge tone="outline">Caffeine free</BBi.Badge>}
            </div>
            <div style={{ display: 'grid', gap: 8 }}>
              <h4>Jar label</h4>
              <p>The 260&ndash;280px jar label carries the same lockup as the info card at a quarter of the height: wordmark, fleuron, product name, hanging-herb motif, ingredient run.</p>
            </div>
            <div style={{ display: 'flex', gap: 10 }}>
              <BBi.Button variant="accent">Add to basket</BBi.Button>
              <BBi.Button variant="ghost" onClick={() => setView('range')}>Back to range</BBi.Button>
            </div>
          </div>
        </div>
      )}

      <p className="note">Recreated from the printed artwork supplied in <code>uploads/</code>. Botanical margin engravings and the hanging-herb motif are cropped from that artwork — they are not redrawn.</p>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
