<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="ext-resource-dependency" content="./../../assets/margin-bedtime-left.png" data-resource-id="mBedtimeL" />
<meta name="ext-resource-dependency" content="./../../assets/margin-bedtime-right.png" data-resource-id="mBedtimeR" />
<meta name="ext-resource-dependency" content="./../../assets/margin-sunset-left.png" data-resource-id="mSunsetL" />
<meta name="ext-resource-dependency" content="./../../assets/margin-sunset-right.png" data-resource-id="mSunsetR" />
<meta name="ext-resource-dependency" content="./../../assets/margin-wildwood-left.png" data-resource-id="mWildwoodL" />
<meta name="ext-resource-dependency" content="./../../assets/margin-wildwood-right.png" data-resource-id="mWildwoodR" />
<meta name="ext-resource-dependency" content="./../../assets/motif-herbs-colour.png" data-resource-id="motifColour" />
<meta name="ext-resource-dependency" content="./../../assets/motif-herbs-wine.png" data-resource-id="motifWine" />
<meta name="ext-resource-dependency" content="./../../assets/motif-herbs-moss.png" data-resource-id="motifMoss" />
<title>Britanical Blends — Packaging</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
body{margin:0;background:var(--surface-page);min-height:100vh}
.page{max-width:1280px;margin:0 auto;padding:44px 40px 72px}
.head{display:grid;justify-items:center;gap:14px;margin-bottom:14px}
.tabs{display:flex;gap:8px;justify-content:center;margin:30px 0 34px;flex-wrap:wrap}
.detail{display:grid;grid-template-columns:auto auto;gap:56px;justify-content:center;align-items:start;margin-top:8px}
.aside{display:grid;gap:22px;max-width:330px;align-content:start;padding-top:8px}
.aside h4{margin:0;font:600 12px/1.4 var(--font-body);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-900)}
.aside p{margin:0;font:var(--type-body-sm);color:var(--ink-700)}
.note{font:var(--weight-regular) 11px/1.6 var(--font-sans);letter-spacing:.04em;color:var(--ink-400);text-align:center;margin-top:56px}
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#604028">
<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
<rect width="1200" height="800" fill="#604028"/>
<circle cx="600" cy="400" r="250" fill="#F8E8D0"/>
<circle cx="600" cy="400" r="228" fill="none" stroke="#604028" stroke-width="4"/>
<circle cx="600" cy="400" r="214" fill="none" stroke="#604028" stroke-width="2"/>
<text x="600" y="378" text-anchor="middle" font-family="Georgia, serif" font-size="72" letter-spacing="10" fill="#4A3117">BRITANICAL</text>
<text x="600" y="466" text-anchor="middle" font-family="Georgia, serif" font-size="72" letter-spacing="10" fill="#4A3117">BLENDS</text>
</svg>
</template>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="blends.js"></script>
<script type="text/babel" src="ProductCard.standalone.jsx"></script>
<script type="text/babel" src="JarLabel.standalone.jsx"></script>
<script type="text/babel" src="CardShelf.jsx"></script>
<script type="text/babel" data-presets="react">
const BBi = window.BritanicalBlendsDesignSystem_707ab1 || {};

function App() {
  const [view, setView] = React.useState('range');
  const [sel, setSel] = React.useState('sunset');
  const blend = BB_BLENDS.find((b) => b.key === sel);
  return (
    <div className="page">
      <header className="head">
        <BBi.Wordmark size="xl" color="var(--bark-700)" />
        <BBi.Strapline size={12} color="var(--ink-500)" />
        <BBi.Fleuron width={260} glyphColor="var(--bark-600)" style={{ marginTop: 4 }} />
      </header>

      <nav className="tabs">
        <BBi.Button size="sm" variant={view === 'range' ? 'primary' : 'secondary'} onClick={() => setView('range')}>The range</BBi.Button>
        {BB_BLENDS.map((b) => (
          <BBi.Button key={b.key} size="sm" variant={view === 'detail' && sel === b.key ? 'primary' : 'secondary'}
            onClick={() => { setSel(b.key); setView('detail'); }}>{b.name.join(' ')}</BBi.Button>
        ))}
      </nav>

      {view === 'range' ? (
        <CardShelf blends={BB_BLENDS} selected={sel} cardWidth={330}
          onSelect={(k) => { setSel(k); setView('detail'); }} />
      ) : (
        <div className="detail" data-accent={blend.accent}>
          <ProductCard blend={blend} width={420} />
          <div className="aside">
            <JarLabel blend={blend} width={280} />
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              <BBi.Badge tone="soft">Loose leaf</BBi.Badge>
              <BBi.Badge tone="outline">50g</BBi.Badge>
              {blend.key === 'sunset' && <BBi.Badge tone="outline">Caffeine free</BBi.Badge>}
            </div>
            <div style={{ display: 'grid', gap: 8 }}>
              <h4>Jar label</h4>
              <p>The 260&ndash;280px jar label carries the same lockup as the info card at a quarter of the height: wordmark, fleuron, product name, hanging-herb motif, ingredient run.</p>
            </div>
            <div style={{ display: 'flex', gap: 10 }}>
              <BBi.Button variant="accent">Add to basket</BBi.Button>
              <BBi.Button variant="ghost" onClick={() => setView('range')}>Back to range</BBi.Button>
            </div>
          </div>
        </div>
      )}

      <p className="note">Recreated from the printed artwork supplied in <code>uploads/</code>. Botanical margin engravings and the hanging-herb motif are cropped from that artwork — they are not redrawn.</p>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
