<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0;padding:0}
.tile{width:1280px;height:854px;display:grid;grid-template-columns:1fr 200px}
.main{background:var(--bark-700);display:grid;place-items:center;padding:0 56px}
.name{font:var(--weight-regular) 132px/0.94 var(--font-display);letter-spacing:.055em;text-indent:.055em;text-transform:uppercase;color:var(--paper-50);text-align:center}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}
.strip span{display:block}
</style></head>
<body>
<div class="tile">
  <div class="main"><div class="name">Britanical<br>Blends</div></div>
  <div class="strip">
    <span style="background:var(--sage-300)"></span>
    <span style="background:var(--wheat-400)"></span>
    <span style="background:var(--moss-500)"></span>
    <span style="background:var(--wine-700)"></span>
  </div>
</div>
</body></html>
